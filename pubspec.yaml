# Graviton omni_app's brain file (Cleaned & Corrected)
name: omni_app
description: "Graviton Omnichannel Market Intelligence"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Standard Flutter dependency
  cupertino_icons: ^1.0.8
  # Fixed Indentation: Added 2 spaces to http and url_launcher relative to dependencies:
  http: ^1.6.0
  url_launcher: ^6.3.2
  fl_chart: ^0.65.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # -- ADDED: The required icon generation tool --
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# -- ADDED: Final configuration telling the tool where your image is --
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21